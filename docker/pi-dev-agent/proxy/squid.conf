http_port 3128

# Only port 443 (HTTPS) may be reached through the proxy — for both plain HTTP
# requests and CONNECT tunnels. Local services never reach the proxy at all;
# they bypass it via NO_PROXY plus direct-allow iptables rules in the agent.
acl SSL_ports port 443

# Blocked destinations are managed as hostnames/domains here. These take
# precedence over the TLD allowlist below (e.g. github.com is .com but still denied).
acl blocked_domains dstdomain "/etc/squid/blocked_domains.txt"

# TLD allowlist: only these top-level domains may be reached through the proxy.
acl allowed_tlds dstdomain "/etc/squid/allowed_tlds.txt"

# Explicit site exceptions to the TLD allowlist (e.g. private registries on other TLDs).
acl allowed_sites dstdomain "/etc/squid/allowed_sites.txt"

http_access deny blocked_domains
http_access deny !SSL_ports
http_access allow allowed_sites
http_access deny !allowed_tlds
http_access allow all

access_log stdio:/tmp/access.log
cache_log /tmp/cache.log
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp