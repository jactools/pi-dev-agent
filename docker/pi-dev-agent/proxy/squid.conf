http_port 3128

# Allow standard web ports and local health/debug traffic.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 3000
acl Safe_ports port 8000
acl Safe_ports port 8080
acl Safe_ports port 8443
acl Safe_ports port 9000
acl Safe_ports port 9001
acl Safe_ports port 10080
acl Safe_ports port 10443
acl Safe_ports port 10444
acl CONNECT method CONNECT

# Blocked destinations are managed as hostnames/domains here.
acl blocked_domains dstdomain "/etc/squid/blocked_domains.txt"

http_access deny blocked_domains
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow all

access_log stdio:/tmp/access.log
cache_log /tmp/cache.log
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp